<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your room — Gather</title><link rel="stylesheet" href="/styles.css"></head><body class="form-page"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">g</span> gather<span class="brand-period">.</span></a><a class="header-link" href="/joinRoom">Have a room code? <span>Join a room ↗</span></a></header><main class="form-wrap"><section class="form-card"><a class="back-link" href="/">← &nbsp;Back home</a><div class="form-kicker">YOUR OWN LITTLE CORNER</div><h1>Room to talk.</h1><p class="form-lede">Your room is ready. Send this code to the people you want to bring together.</p><div class="room-code" id="room-code">······</div><div class="copy-row"><button class="button button-secondary" id="copy-code" type="button">Copy code</button><button class="button button-primary" id="enter-room" type="button">Enter room ↗</button></div><p class="form-error" id="form-error" role="status"></p><p class="form-note">Your room stays around so your conversation is here when your people come back.</p></section></main><script>
const errorNode=document.getElementById('form-error');let roomId='';async function createRoom(){try{const response=await fetch('/createRoom/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not create a room.');roomId=data.roomId;document.getElementById('room-code').textContent=roomId}catch(error){errorNode.textContent=error.message}}createRoom();document.getElementById('copy-code').addEventListener('click',async()=>{if(!roomId)return;try{await navigator.clipboard.writeText(roomId);document.getElementById('copy-code').textContent='Copied!'}catch{errorNode.textContent='Copy is unavailable in this browser. You can select the code to copy it.'}});document.getElementById('enter-room').addEventListener('click',()=>{if(roomId)location.href='/chatting'});
</script></body></html>
