<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a room — Gather</title><link rel="stylesheet" href="/styles.css"></head><body class="form-page"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">g</span> gather<span class="brand-period">.</span></a><a class="header-link" href="/createRoom">Need a room? <span>Start one ↗</span></a></header><main class="form-wrap"><section class="form-card"><a class="back-link" href="/">← &nbsp;Back home</a><div class="form-kicker">YOUR PEOPLE ARE WAITING</div><h1>Come on in.</h1><p class="form-lede">Pop in the six digit code your friend shared with you.</p><form id="join-form"><label class="field-label" for="room-code">Room code</label><input class="field" id="room-code" name="roomId" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="e.g. 428 176" required><button class="button button-primary form-button" type="submit">Join the conversation <span>↗</span></button><p class="form-error" id="form-error" role="alert"></p></form><p class="form-foot">Don't have a code? <a href="/createRoom">Start a room of your own</a></p></section></main><script>
const form=document.getElementById('join-form'),input=document.getElementById('room-code'),error=document.getElementById('form-error');input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6);error.textContent=''});form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;button.firstChild.textContent='Joining… ';error.textContent='';try{const response=await fetch('/joinRoom/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomId:input.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not join the room.');location.href=data.redirect}catch(reason){error.textContent=reason.message;button.disabled=false;button.firstChild.textContent='Join the conversation '}});
</script></body></html>
