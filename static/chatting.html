<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f4ef"><title>Your room — Gather</title><link rel="stylesheet" href="/styles.css"></head><body class="chat-page"><main class="chat-shell"><header class="chat-header"><a class="chat-brand" href="/"><span class="brand-mark">g</span> gather<span class="brand-period">.</span></a><div class="chat-room-meta"><div class="chat-room-label">ROOM CODE</div><div class="chat-room-code" id="room-code">······</div></div><button class="copy-small" id="copy-room" type="button">Copy invite</button></header><div class="chat-body"><aside class="chat-sidebar"><div class="sidebar-kicker">YOUR ROOM</div><div class="online-line"><span class="online-indicator"></span><span id="online-count">1 person here</span></div><div class="people-list" id="people-list"></div><div class="sidebar-tip"><b>A little room for everyone</b>Invite your favorite people with the room code above.</div></aside><section class="conversation"><div class="conversation-top"><b>The conversation</b><p>A good place to catch up.</p></div><div class="messages" id="messages" aria-live="polite"><div class="welcome-note">Say hello, start a story, see where it goes. ✳</div></div><div class="typing-status" id="typing-status" aria-live="polite"></div><form class="composer" id="composer"><div class="composer-wrap"><textarea id="message-input" rows="1" maxlength="2000" placeholder="Write something nice…" aria-label="Your message"></textarea><button class="send-button" id="send-button" type="submit" disabled>Send ↗</button></div><div class="composer-hint">Enter to send &nbsp;·&nbsp; Shift + Enter for a new line</div></form></section></div></main><script src="/socket.io/socket.io.js"></script><script>
const cookie=document.cookie.split('; ').find(part=>part.startsWith('room='));const roomId=cookie?decodeURIComponent(cookie.slice(5)):'';if(!/^\d{6}$/.test(roomId))location.replace('/joinRoom');document.getElementById('room-code').textContent=roomId;let name='';while(!name){name=(window.prompt('What should we call you?')||'').trim().slice(0,32)}const socket=io();const messages=document.getElementById('messages'),input=document.getElementById('message-input'),send=document.getElementById('send-button');let typingTimer;const palette=['#e8efe4','#f3e7db','#e8e9f2','#f5e9eb','#e6efed'];function addMessage(data){const welcome=messages.querySelector('.welcome-note');if(welcome)welcome.remove();const own=data.senderId===socket.id;const row=document.createElement('article');row.className='message-row'+(own?' own':'');const author=document.createElement('div');author.className='message-author';author.textContent=own?'You':data.name;const bubble=document.createElement('div');bubble.className='message-bubble';bubble.textContent=data.message;const time=document.createElement('div');time.className='message-time';const date=data.timestamp?new Date(data.timestamp):new Date();time.textContent=date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});row.append(author,bubble,time);messages.append(row);messages.scrollTop=messages.scrollHeight}function updatePeople(names){const list=document.getElementById('people-list');list.replaceChildren();document.getElementById('online-count').textContent=names.length===1?'1 person here':names.length+' people here';names.forEach((person,index)=>{const item=document.createElement('div');item.className='person'+(person===name?' self':'');const avatar=document.createElement('span');avatar.className='person-avatar';avatar.style.background=palette[index%palette.length];avatar.textContent=person.slice(0,1).toUpperCase();const label=document.createElement('span');label.textContent=person===name?person+' (you)':person;item.append(avatar,label);list.append(item)})}socket.on('connect',()=>{socket.emit('join-room',{roomId,name},result=>{if(!result||result.error){alert(result?.error||'Could not join the room.');location.replace('/joinRoom');return}result.messages.forEach(message=>addMessage(message));})});socket.on('connect_error',()=>{document.getElementById('typing-status').textContent='Reconnecting…'});socket.on('receive-message',addMessage);socket.on('room-users',updatePeople);socket.on('presence',event=>{if(event.name!==name){const status=document.getElementById('typing-status');status.textContent=event.type==='joined'?event.name+' joined the room':event.name+' left the room';setTimeout(()=>{if(status.textContent===event.name+(event.type==='joined'?' joined the room':' left the room'))status.textContent=''},3000)}});socket.on('typing',event=>{const status=document.getElementById('typing-status');status.textContent=event.isTyping?event.name+' is typing…':''});input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,100)+'px';socket.emit('typing',Boolean(input.value.trim()));clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('typing',false),900)});input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('composer').requestSubmit()}});document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();const message=input.value.trim();if(!message)return;send.disabled=true;socket.emit('sendMessage',{message},result=>{if(result?.error){document.getElementById('typing-status').textContent=result.error;send.disabled=false}});input.value='';input.style.height='auto';socket.emit('typing',false);input.focus()});document.getElementById('copy-room').addEventListener('click',async event=>{try{await navigator.clipboard.writeText(roomId);event.currentTarget.textContent='Copied!';setTimeout(()=>event.currentTarget.textContent='Copy invite',1600)}catch{document.getElementById('typing-status').textContent='Room code: '+roomId}});window.addEventListener('pagehide',()=>socket.disconnect());
</script></body></html>
